name: Deploy Sphinx Docs

on:
  push:
    tags:
      - "furo-theme-showcase-*"
      - "use-guidance-*"

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Parse release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^(furo-theme-showcase|use-guidance)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "section=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag must use section-X.Y.Z format: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build this release
        env:
          DOCS_SECTION: ${{ steps.release.outputs.section }}
          DOCS_VERSION: ${{ steps.release.outputs.version }}
        run: uv run sphinx-build -b html -c docs/source "docs/source/${DOCS_SECTION}" "_site/${DOCS_SECTION}/${DOCS_VERSION}"

      - name: Update version indexes
        run: uv run python .github/scripts/generate_version_index.py --output-dir _site

      - name: Deploy and preserve previous releases
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site/
          keep_files: true