name: Deploy Sphinx Docs

# 1. Execution triggers

on:
  push:
    branches: ["main"]   # When pushing to main branch
  workflow_dispatch:      # Manual trigger

# 2. Needed permissions to depliy in GitHub pages
permissions:
  contents: read          
  pages: write             
  id-token: write          

# 3. Jobs definition
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true  # Store libraries in cache

      - name: Set up Python
        run: uv python install  # Install python version in uv

      - name: Install dependencies
        run: uv sync --frozen   # Instala uv libraries

      - name: Build documentation
        # Generate HTML files 
        run: uv run sphinx-build -b html docs/source docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Specify HTML route
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4